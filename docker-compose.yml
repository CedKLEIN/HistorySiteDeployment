services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        UI_IMAGE: ${HISTORY_UI_IMAGE}
    container_name: historysite-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HISTORY_UI_PORT:-8080}:80"
    depends_on:
      - api
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8080}
      VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    networks:
      - internal_net

  init-api:
    image: alpine:3.21
    container_name: historysite-init
    restart: "no"
    command: sh -c "mkdir -p /data /backup && chmod 777 /data /backup"
    volumes:
      - historydata:/data
      - ./backups:/backup
    networks:
      - internal_net

  api:
    depends_on:
      init-api:
        condition: service_completed_successfully
    build:
      context: ./api
      dockerfile: Dockerfile
      args:
        API_IMAGE: ${HISTORY_API_IMAGE}
    container_name: historysite-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HistoryDb: Data Source=/data/history.db
      SiteConfiguration__Email__Password: "${HISTORY_SMTP_PASSWORD}"
      SiteConfiguration__FrontendBaseUrl: "${FRONTEND_URL:-https://roisempereurs.fr}"
      SiteConfiguration__AdminEmails__0: "${HISTORY_ADMIN_EMAIL:-souverainsdefrance1214@gmail.com}"
      SiteConfiguration__Jwt__Token: "${HISTORY_JWT_SECRET}"
      SiteConfiguration__Jwt__Issuer: "${HISTORY_JWT_ISSUER:-HistorySiteBackend}"
      SiteConfiguration__Jwt__Audience: "${HISTORY_JWT_AUDIENCE:-HistorySiteFrontend}"
      SiteConfiguration__AdminSeed__Email: "${HISTORY_ADMIN_EMAIL:-souverainsdefrance1214@gmail.com}"
      SiteConfiguration__AdminSeed__Password: "${HISTORY_ADMIN_PASSWORD}"
      SiteConfiguration__Backup__Enabled: "true"
      SiteConfiguration__Backup__Directory: "/backup"
      SiteConfiguration__Backup__RetentionCount: "14"
      SiteConfiguration__Backup__Hour: "3"
      # Souverain du jour (Bluesky, Pinterest) : coupé tant que les variables ne valent pas true.
      SiteConfiguration__Social__Bluesky__Enabled: "${HISTORY_BLUESKY_ENABLED:-false}"
      SiteConfiguration__Social__Bluesky__Handle: "${HISTORY_BLUESKY_HANDLE:-}"
      SiteConfiguration__Social__Bluesky__AppPassword: "${HISTORY_BLUESKY_APP_PASSWORD:-}"
      SiteConfiguration__Social__Pinterest__Enabled: "${HISTORY_PINTEREST_ENABLED:-false}"
      # Les portraits sont lus sur le conteneur ui, par le réseau interne.
      SiteConfiguration__Social__PortraitBaseUrl: "http://ui"
    volumes:
      - historydata:/data
      - ./backups:/backup
    networks:
      - internal_net

networks:
  internal_net:
    driver: bridge

volumes:
  historydata:
